[agent]
state_dir = "/var/lib/guardski"
offline = false
timeout_seconds = 1800

[schedule]
cron = "0 2 * * *"
run_on_start = true

[engines]
rate_limit = 5
nuclei_templates = []

[[targets]]
id = "mounted-application"
kind = "filesystem"
value = "/targets/application"
owner = "engineering"
scanners = ["vuln", "misconfig", "secret"]
