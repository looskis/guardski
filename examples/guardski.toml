# All cron schedules use UTC. Paths are relative to this configuration file.
[agent]
state_dir = "../.guardski"
offline = false
timeout_seconds = 1800
max_output_mb = 64
max_db_age_hours = 168

[schedule]
cron = "0 2 * * *"
# Immediate first run; restarts preserve the saved next-run time.
run_on_start = true

[engines]
trivy = "trivy"
nuclei = "nuclei"
nmap = "nmap"
rate_limit = 5
# Add specific, reviewed, signed local templates before enabling web targets.
nuclei_templates = []

# These are example organizational SLAs, NOT deadlines prescribed by SOC 2.
[policy]
critical_days = 7
high_days = 30
medium_days = 90
low_days = 180

[[targets]]
id = "application"
kind = "filesystem"
value = ".."
owner = "engineering"
scanners = ["vuln", "misconfig", "secret"]

